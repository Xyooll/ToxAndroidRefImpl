name: Xyool Connect P2P Native Alpha

on:
  push:
    branches:
      - 'xyool/tox-p2p-only-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-p2p-native-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install original Android SDK and NDK versions
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;20.1.5948944'
      - name: Apply Xyool package/authorities and enforce P2P-only push policy
        shell: bash
        run: |
          set -euo pipefail
          bash xyool/brand-alpha.sh
          python3 xyool/p2p-only.py
          python3 xyool/p2p-only.py --verify
          # Policy must be stable across repeated build invocations.
          python3 xyool/p2p-only.py
          python3 xyool/p2p-only.py --verify
      - name: Assemble native Tox encrypted calls and messaging
        working-directory: android-refimpl-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Xyool ID, Android providers, native ToxAV and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android-refimpl-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "org.xyool.connect.tox"
          for authority in std_fileprovider ext2_provider ext1_fileprovider; do
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F "org.xyool.connect.tox.$authority"
          done
          unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/libjni-c-toxcore.so$'
          unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/libnative-audio-jni.so$'
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
      - name: Upload Xyool P2P-only APK
        uses: actions/upload-artifact@v4
        with:
          name: Xyool-Connect-P2P-Native-Alpha
          path: android-refimpl-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
